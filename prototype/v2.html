<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stimuler · IELTS Day 1 — v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
<style>
:root{
  --stage:#0B0B0B; --text:#EEE7DB; --text-muted:#9C9C9C; --word-dim:#7D786F;
  --gold-word:#E9B94D; --gold-border:#9D7C4F; --amber-border:#C98F3F;
  --green-word:#6FD37F; --green-border:#4E9E5C; --red-word:#E07A6E; --red-border:#6E332C;
  --peach:#EAC9B6; --soft-border:#C9A98C; --surface:#262220;
  --card-bg:linear-gradient(180deg,rgba(38,34,30,.5) 0%,rgba(24,22,20,.26) 100%);
  --r-chip:14px; --r-card:16px; --r-full:999px;
  --ease:cubic-bezier(.22,.61,.36,1); --out:cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#171514;font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;
  display:flex;align-items:center;justify-content:center;gap:40px;min-height:100vh;padding:32px}

.phone{position:relative;width:412px;height:917px;flex:0 0 auto;background:#000;border-radius:30px;
  overflow:hidden;box-shadow:0 40px 90px -30px rgba(0,0,0,.9),0 0 0 1px rgba(255,255,255,.05);isolation:isolate}

/* stage colour arrives only when the film proper starts */
.stagebg{position:absolute;inset:0;background:var(--stage);opacity:0;transition:opacity 1.1s var(--ease)}
.stagebg.on{opacity:1}
.backdrop{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity 1.4s var(--ease)}
.backdrop.on{opacity:1}
.backdrop::before{content:'';position:absolute;left:-40%;top:-18%;width:180%;height:120%;
  background:radial-gradient(48% 38% at 50% 30%,rgba(190,150,110,.20) 0%,rgba(120,95,70,.07) 45%,rgba(0,0,0,0) 72%)}
.backdrop::after{content:'';position:absolute;inset:49px 0 0 0;background:rgba(40,40,40,.31)}

/* chrome fades in after the cold open */
.chrome{opacity:0;transition:opacity .9s var(--ease)} .chrome.on{opacity:1}

.status{position:absolute;left:0;top:0;width:412px;display:flex;align-items:center;
  padding:21px 24px 19px;justify-content:space-between;z-index:8}
.status b{color:#fff;font-size:17px;font-weight:600;letter-spacing:-.01em}
.header{position:absolute;left:0;top:78px;width:412px;height:44px;z-index:8}
.iconbtn{position:absolute;top:0;width:44px;height:44px;border-radius:var(--r-full);
  background:rgba(58,56,52,.42);border:1px solid rgba(255,255,255,.11);display:flex;align-items:center;justify-content:center}
.iconbtn.back{left:14px} .iconbtn.flag{left:354px}
.track{position:absolute;left:72px;top:16px;width:268px;height:11px;border-radius:var(--r-full);
  background:rgba(190,150,125,.34);box-shadow:inset 0 1px 2px rgba(0,0,0,.45)}
.fill{position:absolute;left:0;top:0;height:11px;width:0;border-radius:var(--r-full);
  background:linear-gradient(180deg,rgba(255,255,255,.34),rgba(255,255,255,0) 60%),#C9A38A;transition:width .9s linear}
.knob{position:absolute;top:-1px;left:-7px;width:13px;height:13px;border-radius:var(--r-full);
  background:#fff;box-shadow:0 1px 5px rgba(0,0,0,.5);transition:left .9s linear}

/* ---------- shot grammar ---------- */
.rig{position:absolute;left:50%;z-index:4;
  transition:width .8s var(--out),height .8s var(--out),top .8s var(--out),
             margin-left .8s var(--out),opacity .55s var(--ease),transform 4.2s var(--out)}
.rig .ring{position:absolute;inset:0;border-radius:var(--r-full);border:2px solid #A9805A;
  box-shadow:0 0 34px -6px rgba(190,140,86,.42);transition:opacity .7s var(--ease),border-color .7s}
.rig .hole{position:absolute;inset:5px;border-radius:var(--r-full);overflow:hidden;background:#000}
.rig video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 18%}
.shot-wide  {width:266px;height:266px;margin-left:-133px;top:176px;opacity:1}
.shot-medium{width:154px;height:154px;margin-left:-77px; top:150px;opacity:1}
.shot-close {width:214px;height:214px;margin-left:-107px;top:150px;opacity:1}
.shot-close .ring{opacity:.35}
.shot-close video{object-position:50% 14%;transform:scale(1.22)}
.shot-tiny  {width:60px; height:60px; margin-left:-146px;top:142px;opacity:.45}
.shot-tiny .ring{border-width:1.5px;box-shadow:none}
.shot-gone  {width:154px;height:154px;margin-left:-77px;top:150px;opacity:0;pointer-events:none}
.rig.push{transform:scale(1.065)}

/* ---------- captions ---------- */
.capD{position:absolute;left:36px;width:340px;top:486px;z-index:6;color:#fff;
  font-size:33px;font-weight:600;letter-spacing:-.028em;line-height:44px;text-align:center}
.capB{position:absolute;left:36px;width:340px;top:326px;z-index:6;display:flex;flex-direction:column;align-items:center}
.capB i{width:0;height:0;border-left:11px solid transparent;border-right:11px solid transparent;border-bottom:11px solid var(--surface)}
.capB > span{display:inline-block;background:var(--surface);border:1px solid rgba(255,255,255,.09);
  border-radius:var(--r-chip);box-shadow:0 8px 22px -10px rgba(0,0,0,.6);padding:13px 22px;
  color:#D9D4CD;font-size:15px;font-weight:500;line-height:20px;letter-spacing:-.006em;text-align:center;max-width:340px}
.hid{opacity:0;pointer-events:none}
.ci{display:inline;animation:ci .46s var(--out) both}
@keyframes ci{from{opacity:0;transform:translateY(9px);filter:blur(3px)}to{opacity:1;transform:none;filter:none}}
.co{animation:co .26s var(--ease) both}
.em{font-style:normal;color:inherit;transition:color .55s var(--ease)}
.em.lit{color:var(--gold-word)}
@keyframes co{to{opacity:0;transform:translateY(-7px)}}

/* ---------- slot ---------- */
.slot{position:absolute;left:36px;width:340px;top:436px;z-index:3}
.slot.enter > *{animation:si .62s var(--out) both}
@keyframes si{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.slot.leaving{animation:so .34s var(--ease) both}
@keyframes so{to{opacity:0;transform:translateY(-10px)}}

.kicker{color:var(--gold-word);font-size:11.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase}
.h2{color:#fff;font-size:30px;font-weight:600;letter-spacing:-.025em;line-height:39px}
.body{color:var(--text-muted);font-size:15.5px;line-height:25px}
.col{display:flex;flex-direction:column} .stack{display:flex;flex-direction:column;gap:12px}

/* cold open */
.micro{position:absolute;left:36px;width:340px;z-index:6;text-align:center;
  color:#6E6A64;font-size:13.5px;letter-spacing:.16em;text-transform:uppercase;font-weight:600}

/* part cards */
.pcard{display:flex;align-items:center;gap:16px;border-radius:var(--r-card);border:1.5px solid #3A342C;
  padding:17px 20px;transition:border-color .55s var(--ease),background .55s var(--ease),padding .55s var(--ease)}
.pcard > .col{flex:1 1 auto;min-width:0}
.pcard .no{width:54px;flex:0 0 54px;font-size:13px;font-weight:600;letter-spacing:.1em;color:#7D786F;transition:color .55s}
.pcard .tt{color:#B5B0A7;font-size:17px;font-weight:500;line-height:23px;transition:color .55s}
.pcard .sub{color:#75716A;font-size:14px;line-height:19px;max-height:0;opacity:0;overflow:hidden;
  transition:max-height .55s var(--ease),opacity .45s var(--ease)}
.pcard .min{margin-left:auto;color:#5E5A54;font-size:13.5px;font-weight:500;flex:0 0 auto;transition:color .55s}
.pcard.on{border-color:var(--gold-border);background:var(--card-bg);padding:19px 20px}
.pcard.on .no{color:var(--gold-word)} .pcard.on .tt{color:#fff}
.pcard.on .sub{max-height:44px;opacity:1} .pcard.on .min{color:var(--word-dim)}

/* criteria */
.crit{display:flex;flex-wrap:wrap;gap:12px}
.crit .cc{display:flex;align-items:center;gap:10px;padding:13px 18px 13px 15px;border:1.5px solid var(--gold-border);
  border-radius:var(--r-full);background:var(--card-bg);color:#fff;font-size:15.5px;font-weight:500;
  opacity:0;transform:translateY(10px) scale(.96);transition:opacity .5s var(--out),transform .5s var(--out)}
.crit .cc.in{opacity:1;transform:none}

.opin{border:1px solid #4A3D2A;background:#211E1A;border-radius:var(--r-card);padding:22px;display:flex;flex-direction:column;gap:16px}
.quote{display:flex;align-items:center;gap:12px}
.quote em{flex:1;font-style:normal;color:#fff;font-size:17px;line-height:24px}
.quote .ok{color:var(--green-word);font-size:13px;font-weight:600;flex:0 0 auto}

.bul{display:flex;flex-direction:column;gap:10px}
.bul div{display:flex;align-items:flex-start;gap:12px}
.bul i{width:5px;height:5px;border-radius:999px;background:var(--gold-word);flex:0 0 5px;margin-top:10px}
.bul p{color:#A8A39B;font-size:16.5px;line-height:25px}

/* --- the match-cut answer bubble --- */
.chat{display:flex;flex-direction:column;gap:16px}
.ask{align-self:flex-start;max-width:280px;background:#1E1C1A;border:1px solid #3A342C;
  border-radius:20px 20px 20px 6px;padding:15px 20px;color:#B5B0A7;font-size:17px;line-height:25px}
.ans{align-self:flex-end;max-width:300px;display:flex;gap:12px;padding:15px 18px;border-radius:20px 20px 6px 20px;
  font-size:17px;line-height:26px;background:rgba(110,51,44,.28);border:1px solid var(--red-border);color:#E5C3BC;
  transition:background .9s var(--ease),border-color .9s var(--ease),color .9s var(--ease)}
.ans .mk{flex:0 0 17px;height:17px;margin-top:4px;position:relative}
.ans .mk svg{position:absolute;inset:0;transition:opacity .5s var(--ease)}
.ans .mk .g{opacity:0}
.ans .more{max-height:0;opacity:0;overflow:hidden;
  transition:max-height .9s var(--out),opacity .7s var(--ease) .15s}
.ans.plain{background:#1E1C1A;border-color:#3A342C;color:#B5B0A7}
.ans.plain .mk{opacity:0}
.ans.good{background:rgba(46,86,54,.24);border-color:var(--green-border);color:#D9EBDC}
.ans.good .mk .r{opacity:0} .ans.good .mk .g{opacity:1}
.ans.good .more{max-height:120px;opacity:1}

.tip{display:flex;align-items:center;gap:12px;background:#211E1A;border:1px solid #4A3D2A;
  border-radius:var(--r-chip);padding:15px 18px;color:var(--gold-word);font-size:15.5px;font-weight:500;line-height:21px}
.choice{display:flex;flex-direction:column;gap:12px}
.opt{display:flex;align-items:center;gap:16px;border:1.5px solid var(--gold-border);border-radius:var(--r-card);
  background:var(--card-bg);padding:20px 22px;cursor:pointer;color:#fff;font-size:18px;font-weight:500;
  transition:transform .18s var(--ease),border-color .25s,opacity .4s}
.opt:hover{border-color:var(--amber-border)} .opt:active{transform:scale(.985)}
.opt.picked{border-color:var(--gold-word);background:rgba(201,163,138,.13)}
.opt.dim{opacity:.3}

.qcard{position:relative;border:1.5px solid var(--gold-border);border-radius:var(--r-card);background:var(--card-bg);
  padding:30px 26px;min-height:150px;display:flex;align-items:center;justify-content:center}
.qcard p{color:#fff;font-size:23px;line-height:34px;text-align:center}
.qcard.naked{border-color:#3A342C;background:transparent}
.qtag{position:absolute;left:22px;top:-14px;display:flex;align-items:center;gap:7px;background:#26231F;
  border:1.5px solid var(--gold-border);border-radius:10px;padding:3px 12px 3px 10px;
  color:#C79A5A;font-size:13.5px;font-weight:500;letter-spacing:.02em}

.miczone{position:absolute;left:0;top:742px;width:412px;z-index:6;display:flex;flex-direction:column;align-items:center;gap:12px}
.mictip{background:var(--surface);border:1px solid rgba(255,255,255,.09);border-radius:10px;padding:7px 14px;color:#D9D4CD;font-size:13px;font-weight:500}
.mic{width:84px;height:84px;border-radius:var(--r-full);border:0;cursor:pointer;
  background:radial-gradient(ellipse 72% 72% at 50% 34%,#D9A94F 0%,#A8813A 100%);
  box-shadow:0 0 0 8px rgba(227,178,74,.07),0 16px 32px -10px rgba(0,0,0,.6);
  display:flex;align-items:center;justify-content:center;animation:mp 2.2s ease-in-out infinite}
@keyframes mp{0%,100%{box-shadow:0 0 0 8px rgba(227,178,74,.07),0 16px 32px -10px rgba(0,0,0,.6)}
  50%{box-shadow:0 0 0 17px rgba(227,178,74,.03),0 16px 32px -10px rgba(0,0,0,.6)}}
.rec{position:absolute;left:24px;top:770px;width:364px;z-index:6;display:flex;flex-direction:column;align-items:center;gap:13px}
.rectime{display:flex;align-items:center;gap:8px;color:var(--text-muted);font-size:13.5px;font-weight:500;letter-spacing:.03em}
.rectime i{width:7px;height:7px;border-radius:999px;background:#E0483C;animation:bk 1.4s ease-in-out infinite}
@keyframes bk{0%,100%{opacity:1}50%{opacity:.25}}
.pill{width:364px;height:66px;border-radius:999px;background:#1E1C1A;border:1px solid #4A3D2A;
  display:flex;align-items:center;justify-content:space-between;padding:0 9px}
.pbtn{width:48px;height:48px;border-radius:999px;border:0;cursor:pointer;display:flex;align-items:center;justify-content:center}
.pbtn.x{background:#2E2A24} .pbtn.ok{background:#C9A38A}
.bars{display:flex;align-items:center;gap:4px;height:38px}
.bars i{width:3px;border-radius:2px;background:#C9A38A;height:8px}
.bars i.lo{background:#8A7A5E} .bars i.hi{background:#F0DCC4}
.nudge{position:absolute;left:36px;top:700px;width:340px;z-index:6;display:flex;align-items:center;gap:11px;
  background:#2A2114;border:1px solid var(--amber-border);border-radius:var(--r-chip);padding:13px 16px;
  color:var(--gold-word);font-size:14.5px;font-weight:500;line-height:20px;animation:ci .5s var(--out) both}

.stu{display:flex;align-items:center;gap:14px}
.stuav{width:58px;height:58px;border-radius:999px;flex:0 0 58px;border:1.5px solid var(--soft-border);
  background:linear-gradient(160deg,#3A322C,#221D1A);display:flex;align-items:center;justify-content:center;
  color:var(--peach);font-size:19px;font-weight:600}
.stu .nm{color:#fff;font-size:17px;font-weight:500;line-height:23px}
.stu .mt{color:#75716A;font-size:13.5px;line-height:19px}

/* --- model answer, and its collapse into the skeleton --- */
.model{display:flex;flex-direction:column;gap:14px}
.ml{opacity:0;transform:translateY(12px);
  transition:opacity .55s var(--out),transform .55s var(--out),gap .7s var(--ease),padding .7s var(--ease),border-color .7s}
.ml.in{opacity:1;transform:none}
.ml .tag{display:block;margin-bottom:6px;font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--gold-word)}
.ml .full{font-size:17px;line-height:27px;color:var(--gold-word);transition:opacity .45s var(--ease),max-height .7s var(--ease)}
.ml .short{font-size:15.5px;line-height:22px;color:#B5B0A7;max-height:0;opacity:0;overflow:hidden;
  transition:opacity .45s var(--ease) .3s,max-height .7s var(--ease) .2s}
.ml.core .full{color:#fff;font-weight:500} .ml.core .tag{color:#8E8880}
/* collapsed state */
.model.fold{gap:0}
.model.fold .ml{display:flex;gap:16px;padding:14px 0;border-bottom:1px solid #2A2621;transform:none}
.model.fold .ml .tag{margin-bottom:0;width:112px;flex:0 0 112px;font-size:13.5px;letter-spacing:0;
  text-transform:none;font-weight:600;line-height:22px;color:var(--gold-word)}
.model.fold .ml .txt{flex:1 1 auto;min-width:0}
.model.fold .ml .full{max-height:0;opacity:0;overflow:hidden}
.model.fold .ml .short{max-height:60px;opacity:1}
.model.fold .ml.drop{max-height:0;opacity:0;padding:0;border:0;overflow:hidden}
.warn{color:#75716A;font-size:13.5px;line-height:21px;padding-top:4px;opacity:0;transition:opacity .6s var(--ease)}
.warn.in{opacity:1}

.recap{border:1px solid #3A342C;background:#1A1815;border-radius:var(--r-card);padding:22px;display:flex;flex-direction:column;gap:16px}
.play{display:flex;align-items:center;gap:11px}
.play .pb{width:34px;height:34px;border-radius:999px;background:#2E2A24;display:flex;align-items:center;justify-content:center;flex:0 0 34px}
.play .wv{flex:1;display:flex;align-items:center;gap:2.5px;height:20px}
.play .wv i{width:2.5px;border-radius:2px;background:#8A7A6B}
.play .tm{color:#75716A;font-size:13px;font-weight:500}
.said{color:#B5B0A7;font-size:16.5px;line-height:26px}
.rule{height:1px;background:#3A342C}
.stats{display:flex;gap:26px}
.stats div{display:flex;flex-direction:column;gap:3px}
.stats b{color:#fff;font-size:22px;font-weight:600;letter-spacing:-.02em;line-height:28px}
.stats b.g{color:var(--gold-word)} .stats span{color:#75716A;font-size:12.5px;line-height:17px}
.donechip{display:flex;align-items:center;gap:12px}
.donechip i{width:34px;height:34px;border-radius:999px;background:#1E3222;border:1.5px solid var(--green-border);
  display:flex;align-items:center;justify-content:center;flex:0 0 34px}
.donechip b{color:var(--green-word);font-size:17px;font-weight:600}
.tomorrow{border:1px solid #3A342C;background:#1A1815;border-radius:var(--r-card);padding:22px;display:flex;flex-direction:column;gap:12px}
.cta{width:340px;height:58px;border-radius:var(--r-full);background:#C9A38A;border:0;cursor:pointer;
  color:#1A1512;font-size:16.5px;font-weight:600;display:flex;align-items:center;justify-content:center}

/* start gate */
.gate{position:absolute;inset:0;z-index:30;background:#0A0908;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:26px;transition:opacity .8s var(--ease)}
.gate.off{opacity:0;pointer-events:none}
.gate .lbl{color:#6E6A64;font-size:12px;font-weight:600;letter-spacing:.2em;text-transform:uppercase}
.gate .ttl{color:#EEE7DB;font-size:28px;font-weight:600;letter-spacing:-.025em}
.gate button{width:76px;height:76px;border-radius:999px;border:1.5px solid #4A423A;background:#161412;
  cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .2s var(--ease),border-color .3s}
.gate button:hover{border-color:var(--gold-border);transform:scale(1.04)}
.gate .hint{color:#4F4B46;font-size:12.5px}

.side{width:300px;flex:0 0 300px;color:#8A8580;align-self:flex-start;padding-top:12px}
.side h1{color:#EEE7DB;font-size:19px;font-weight:600;letter-spacing:-.02em;margin-bottom:4px}
.side .v{color:var(--gold-word);font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;margin-bottom:10px}
.side p{font-size:13.5px;line-height:21px;margin-bottom:18px}
.side .ch{display:flex;flex-direction:column;gap:3px}
.side .c{display:flex;gap:10px;padding:8px 10px;border-radius:8px;font-size:12.5px;line-height:17px;color:#6E6A64;
  transition:background .3s,color .3s}
.side .c b{flex:0 0 40px;font-weight:600;color:#55514C;font-variant-numeric:tabular-nums}
.side .c.on{background:rgba(201,163,138,.12);color:#E9B94D} .side .c.on b{color:#E9B94D}
.side .c.done{color:#5C5852}
.side .ctl{display:flex;gap:8px;margin-top:18px}
.side button{background:#231F1C;border:1px solid #3A342C;color:#C9C3BA;font-size:12.5px;font-weight:500;
  padding:8px 14px;border-radius:8px;cursor:pointer;font-family:inherit}
.side button:hover{border-color:#5A5048}
</style>
</head>
<body>
<div class="phone" id="phone">
  <div class="stagebg" id="stagebg"></div>
  <div class="backdrop" id="backdrop"></div>

  <div class="chrome" id="chrome">
    <div class="status"><b>9:41</b>

<script>
const $=id=>document.getElementById(id);
const rig=$('rig'), capD=$('capD'), capB=$('capB'), capBS=capB.querySelector('span'),
      microEl=$('micro'), slot=$('slot'), extra=$('extra'), fillEl=$('fill'), knob=$('knob'),
      stagebg=$('stagebg'), backdrop=$('backdrop'), chrome=$('chrome'), chapters=$('chapters');

/* seamless loop: two videos offset by half, crossfaded across the seam */
const vA=$('vA'), vB=$('vB');
vA.play().catch(()=>{}); vB.play().catch(()=>{});
vA.addEventListener('loadedmetadata',()=>{try{vB.currentTime=vA.duration/2}catch(e){}});
(function blend(){const D=vA.duration||7.36,x=vA.currentTime||0,f=.7;
  let a=1; if(x>D-f)a=(D-x)/f; else if(x<f)a=x/f;
  vA.style.opacity=a; vB.style.opacity=1-a; requestAnimationFrame(blend);})();

/* ---------- primitives ---------- */
let T=[];
const at=(ms,fn)=>T.push(setTimeout(fn,ms));
const kill=()=>{T.forEach(clearTimeout);T=[]};
function shot(n,push){ rig.className='rig shot-'+n;
  if(push){ void rig.offsetWidth; rig.classList.add('push'); } }
function say(txt,style,emph){
  const host=style==='d'?capD:capB, el=style==='d'?capD:capBS, other=style==='d'?capB:capD;
  other.classList.add('hid'); host.classList.remove('hid');
  el.innerHTML=`<span class="ci">${emph?txt.replace(emph,`<em class="em">${emph}</em>`):txt}</span>`;
  if(emph) at(780,()=>{const e=el.querySelector('.em'); if(e)e.classList.add('lit')});
}
function unsay(){[capD,capB].forEach(h=>{const s=h.querySelector('.ci');if(s)s.classList.add('co');});
  at(250,()=>{capD.classList.add('hid');capB.classList.add('hid')});}
function put(html,top){ slot.style.top=(top||436)+'px';
  slot.classList.remove('enter'); void slot.offsetWidth; slot.innerHTML=html; slot.classList.add('enter'); }
function pull(){ slot.classList.add('leaving');
  at(340,()=>{slot.innerHTML='';slot.classList.remove('leaving','enter')}); }
function micro(t,top){ microEl.style.top=(top||600)+'px'; microEl.classList.remove('hid');
  microEl.innerHTML=`<span class="ci">${t}</span>`; }
function unmicro(){ const s=microEl.querySelector('.ci'); if(s)s.classList.add('co');
  at(250,()=>microEl.classList.add('hid')); }

/* ---------- components ---------- */
const I={
 fluency:`<svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M3 12c2.5 0 2.5-5 5-5s2.5 10 5 10 2.5-5 5-5" stroke="#E9B94D" stroke-width="1.9" stroke-linecap="round"/><path d="M21 12h1" stroke="#E9B94D" stroke-width="1.9" stroke-linecap="round"/></svg>`,

 grammar:`<svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M4 17.5 9.2 6.5l5.2 11" stroke="#E9B94D" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/><path d="M6 13.6h6.4" stroke="#E9B94D" stroke-width="1.9" stroke-linecap="round"/><path d="M17 17.5h4" stroke="#E9B94D" stroke-width="1.9" stroke-linecap="round"/></svg>`,
 pron:`<svg width="18" height="18" viewBox="0 0 24 24" fill="none"><rect x="9.2" y="3" width="5.6" height="11" rx="2.8" stroke="#E9B94D" stroke-width="1.8"/><path d="M5.5 11.6v.9a6.5 6.5 0 0 0 13 0v-.9" stroke="#E9B94D" stroke-width="1.8" stroke-linecap="round"/><path d="M12 19v2.2" stroke="#E9B94D" stroke-width="1.8" stroke-linecap="round"/></svg>`,

 heart:`<svg width="21" height="21" viewBox="0 0 24 24" fill="none"><path d="M12 20.5S4.5 16.1 4.5 10.9A4.2 4.2 0 0 1 12 8.3a4.2 4.2 0 0 1 7.5 2.6c0 5.2-7.5 9.6-7.5 9.6" stroke="#E9B94D" stroke-width="1.8" stroke-linejoin="round"/></svg>`,

const P=[['PART 1','About you','Short questions, short answers','4–5 min'],

const parts=a=>`<div class="stack">`+P.map((p,i)=>

const opin=()=>`<div class="opin">${I.ban}
  <div style="color:#fff;font-size:22px;font-weight:500;letter-spacing:-.015em;line-height:31px">Your opinions are not scored</div>

const M=[['the answer',"I'm in my final year of college, studying commerce,",'What you do','final year, studying commerce'],

const model=()=>`<div class="col" style="gap:18px">

  [5700, ()=>{ unsay(); gateMic(); }]
]},

{ch:'Another student', sub:'the answer, built', end:37600, cues:[
  [0,    ()=>{ shot('wide'); pull(); extra.innerHTML=''; }],
  [700,  ()=> say("That was good.",'d')],
  [2700, hold],                                              // ← 900ms. let it land.
  [3600, ()=> say("However that felt, don't worry.",'d')],
  [6100, ()=> say("First answers are always short.",'d')],
  [8700, ()=>{ unsay(); shot('medium'); }],
  [9300, ()=> put(student(),446)],
  [9750, ()=> say("While your feedback loads —",'b')],
  [11700,()=> say("listen to how another student answered this.",'b')],
  [14500,()=>{ unsay(); pull(); }],
  [15100,()=>{ shot('tiny'); put(model(),236); }],
  [16000,()=> mline(0)],                                     // the core answer, alone
  [18700,()=> mline(1)],                                     // + one detail
  [21000,()=> mline(2)],
  [23300,()=> mline(3)],
  [26100,()=> micro('the answer was one sentence',768)],
  [28400,()=>{ const b=$('mbox'); if(b){ b.classList.add('fold');
               M.forEach((m,k)=>{ const t=b.querySelector(`.ml[data-i="${k}"] .tag`); if(t&&m[2]) t.textContent=m[2]; });
               const d=b.querySelector('.ml[data-i="3"]'); if(d) d.classList.add('drop'); } }],  // collapse, no cut
  [30900,()=>{ unmicro(); at(400,()=>micro('everything else was extra — and that is what gets scored',760)); }],
  [33600,()=>{ const w=$('warn'); if(w) w.classList.add('in'); }],
  [36400,()=> unmicro()]
]},

{ch:'Payoff', sub:'your answer, and tomorrow', end:20000, cues:[
  [0,    ()=>{ shot('gone'); pull(); }],
  [520,  ()=> put(recap(),150)],
  [9200, ()=> pull()],
  [9820, ()=> put(done(),160)]
]}];

const mline=i=>{const e=document.querySelector(`.ml[data-i="${i}"]`); if(e) e.classList.add('in')};

/* ---------- gates ---------- */
function gateChoice(){
  const opts=[...document.querySelectorAll('.opt')];
  const go=el=>{opts.forEach(o=>o!==el&&o.classList.add('dim')); el.classList.add('picked');
    kill(); at(800,()=>scene(si+1));};
  opts.forEach(o=>o.onclick=()=>go(o));
  at(4200,()=>{ if(!document.querySelector('.opt.picked')&&opts[0]) go(opts[0]); });
}
function gateMic(){
  extra.innerHTML=`<div class="miczone"><div class="mictip">Tap to speak</div>
    <button class="mic" id="micBtn"><svg width="27" height="38" viewBox="0 0 28 40" fill="none">
    <rect x="9.2" y="2.6" width="9.6" height="22.4" rx="4.8" stroke="#fff" stroke-width="3.1"/>
    <path d="M3.6 17.4v2.1a10.4 10.4 0 0 0 20.8 0v-2.1" stroke="#fff" stroke-width="3.1" stroke-linecap="round"/>
    <path d="M14 29.9v7.5" stroke="#fff" stroke-width="3.1" stroke-linecap="round"/></svg></button></div>`;
  const go=()=>{kill(); record();};
  $('micBtn').onclick=go; at(4000,go);
}
function record(){
  progressTo(cum(4)/TOTAL,15000);
  extra.innerHTML=`<div class="rec"><div class="rectime"><i></i><span id="rt">0:00</span></div>
    <div class="pill"><button class="pbtn x"><svg width="17" height="17" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18" stroke="#A79C8C" stroke-width="2.2" stroke-linecap="round"/></svg></button>
    <div class="bars" id="bars">${Array.from({length:20},()=>'<i></i>').join('')}</div>
    <button class="pbtn ok" id="okBtn"><svg width="19" height="19" viewBox="0 0 24 24" fill="none"><path d="M5 12.5l5 5L19 7" stroke="#1A1512" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div></div>`;
  const bars=[...$('bars').children]; let s=0;
  const anim=setInterval(()=>bars.forEach((b,k)=>{
    const h=6+Math.abs(Math.sin(Date.now()/210+k*.8))*30*(k>16?.35:1);
    b.style.height=h+'px'; b.className=h>26?'hi':h<12?'lo':'';}),70);
  const tick=setInterval(()=>{s++; const rt=$('rt'); if(rt) rt.textContent='0:'+String(s).padStart(2,'0');
    if(s===9&&!document.querySelector('.nudge'))
      extra.insertAdjacentHTML('beforeend',`<div class="nudge">${I.bulb}Try adding one more sentence</div>`);
    if(s>=14) stop();},1000);
  const stop=()=>{clearInterval(anim);clearInterval(tick);kill();scene(4)};
  $('okBtn').onclick=stop;
}

/* ---------- engine ---------- */
let si=-1;
const LEN=SC.map(s=>s.end + (s.gate==='choice'?5000:s.gate==='mic'?19000:0));
const TOTAL=LEN.reduce((a,b)=>a+b,0);
const cum=n=>LEN.slice(0,n+1).reduce((a,b)=>a+b,0);
function progressTo(frac,ms){ const w=268*Math.min(frac,1);
  fillEl.style.transition=`width ${ms}ms linear`; knob.style.transition=`left ${ms}ms linear`;
  fillEl.style.width=w+'px'; knob.style.left=(w-7)+'px'; }

SC.forEach((s,n)=>{const d=document.createElement('div');d.className='c';d.id='c'+n;
  d.innerHTML=`<b>${String(n+1).padStart(2,'0')}</b><span>${s.ch}<br><span style="opacity:.6">${s.sub}</span></span>`;
  chapters.appendChild(d)});

function scene(n){
  kill(); si=n; const S=SC[n];
  [...chapters.children].forEach((c,k)=>c.className='c'+(k===n?' on':k<n?' done':''));
  progressTo(cum(n)/TOTAL, LEN[n]);
  S.cues.forEach(([t,fn])=>at(t,fn));
  if(!S.gate) at(S.end,()=>{ if(n+1<SC.length) scene(n+1); });
}
$('restart').onclick=()=>location.reload();
scene(0);

</script>
